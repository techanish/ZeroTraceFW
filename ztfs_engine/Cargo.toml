[package]
name = "ztfs_engine"
version = "0.1.0"
edition = "2021"
description = "ZeroTraceFW Rust Security Engine — AES-256-GCM, anti-debug, VM detection, secure memory"

[lib]
name = "ztfs_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
hex = "0.4"
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
